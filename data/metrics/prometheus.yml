global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # # File-based discovery for local Windows exporters. Add/remove JSON files under metrics/targets.
  # - job_name: windows_hosts
  #   file_sd_configs:
  #     - files:
  #       - /etc/prometheus/targets/windows_exporter.json
  #       refresh_interval: 15s
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance

  # Dynamic discovery via backend HTTP SD endpoint.
  - job_name: cockpit_machines
    metrics_path: /metrics
    http_sd_configs:
      - url: http://host.docker.internal:3000/monitoring/prometheus/targets
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [machine]
        target_label: machine
  # PostgreSQL metrics via postgres_exporter (multi-target support)
  - job_name: postgres
    metrics_path: /probe
    http_sd_configs:
      - url: http://host.docker.internal:3000/monitoring/prometheus/postgres-targets?token=QhetYEjjndvdpxLM9XX0xmsLMSHL7zKqxx-tbPFYu-c
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9187

  # MySQL metrics via mysqld_exporter
  - job_name: mysql
    static_configs:
      - targets: ['mysql_exporter:9104']
    metrics_path: /metrics

# Optional: add alerts by including rule_files and Alertmanager config later.
