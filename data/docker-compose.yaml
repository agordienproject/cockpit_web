services:
  postgres_nap:
    image: postgres:17
    container_name: postgres_nap
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cockpit_nap
    restart: always
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
    - 9090:9090
    volumes:
    - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./metrics/targets:/etc/prometheus/targets:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    ports:
    - 9187:9187
    environment:
      PG_EXPORTER_WEB_TELEMETRY_PATH: /metrics
    volumes:
    - ./metrics/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    command:
    - --config.file=/etc/postgres_exporter/postgres_exporter.yml
    depends_on:
    - postgres_nap
  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter
    restart: unless-stopped
    ports:
    - 9104:9104
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
    - ./metrics/.my.cnf:/etc/mysql/.my.cnf:ro
    command:
    - --config.my-cnf=/etc/mysql/.my.cnf
  mssql_exporter:
    image: awaragi/prometheus-mssql-exporter:latest
    container_name: mssql_exporter
    restart: unless-stopped
    ports:
    - 4860:4860
    environment:
      SERVER: host.docker.internal
      PORT: '1433'
      USERNAME: sa
      PASSWORD: YourPassword123!
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
    - prometheus
    - postgres_exporter
    - mysql_exporter
    - mssql_exporter
    ports:
    - 3100:3000
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_AUTH_ANONYMOUS_ENABLED=false
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
    - GF_SERVER_SERVE_FROM_SUB_PATH=true
    - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
    - grafana_data:/var/lib/grafana
volumes:
  pgdata: null
  pgdata1: null
  prometheus_data: null
  grafana_data: null
  mssql_data: null
