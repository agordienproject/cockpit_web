services:
  postgres_nap:
    image: postgres:17
    container_name: postgres_nap
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cockpit_nap
    restart: always
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: null
